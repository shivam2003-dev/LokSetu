global:
  imagePullPolicy: IfNotPresent

components:
  serviceAccount: true
  api: true
  web: true
  citizen: true
  batch: true
  postgres: true
  ingress: true
  managedCertificate: true
  hpa: true

serviceAccount:
  annotations: {}

web:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/web
    tag: latest
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

citizen:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/citizen
    tag: latest
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 80m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi

api:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/api
    tag: latest
  service:
    port: 8080
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 600m
      memory: 512Mi
  env:
    NODE_ENV: production
    DATABASE_URL: ""
    VERTEX_AI_LOCATION: us-central1
    VERTEX_AI_MODEL: gemini-1.5-flash
    VERTEX_AI_DISABLED: "false"
    OPENAI_COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
    OPENAI_COMPATIBLE_MODEL: google/gemini-2.0-flash-001
    BATCH_SCHEDULE: "*/15 * * * *"
  openAiCompatible:
    existingSecret: ""
    secretKey: api-key
  googleMaps:
    existingSecret: ""
    secretKey: api-key
    mapId: ""
    mapIdExistingSecret: ""
    mapIdSecretKey: map-id
  boundaries:
    configMapName: ""
    mountPath: /app/services/api/boundaries

batch:
  enabled: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

ingress:
  enabled: true
  className: gce
  host: people-priority.example.gov
  citizenHost: citizen.people-priority.example.gov
  annotations:
    kubernetes.io/ingress.global-static-ip-name: people-priority-ingress-ip
    networking.gke.io/managed-certificates: people-priority-cert
  managedCertificate:
    enabled: true
    name: people-priority-cert
    domains:
      - people-priority.example.gov
      - citizen.people-priority.example.gov

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

postgres:
  enabled: false
  image: postgres:16-alpine
  database: loksetu
  username: loksetu
  password: loksetu
  storage: 10Gi
