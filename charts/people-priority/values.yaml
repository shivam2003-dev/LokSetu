global:
  imagePullPolicy: IfNotPresent

components:
  serviceAccount: true
  api: true
  web: true
  citizen: true
  ragApi: true
  embeddingWorker: true
  ingestionWorker: true
  batch: true
  postgres: true
  ingress: true
  managedCertificate: true
  hpa: true
  serviceMonitor: true
  simulationTraffic: false

serviceAccount:
  annotations: {}

web:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/web
    tag: latest
  serviceAnnotations: {}
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

citizen:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/citizen
    tag: latest
  serviceAnnotations: {}
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 80m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi

api:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/api
    tag: latest
  serviceAnnotations: {}
  service:
    port: 8080
  database:
    existingSecret: ""
    secretKey: DATABASE_URL
  auth:
    existingSecret: ""
    passwordKey: password
    secretKey: token-secret
    adminUsernameKey: admin-username
    adminPasswordKey: admin-password
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 600m
      memory: 512Mi
  env:
    NODE_ENV: production
    DATABASE_URL: ""
    VERTEX_AI_LOCATION: us-central1
    VERTEX_AI_MODEL: gemini-1.5-flash
    VERTEX_AI_DISABLED: "false"
    OPENAI_COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
    OPENAI_COMPATIBLE_MODEL: google/gemini-2.0-flash-001
    BATCH_SCHEDULE: "*/15 * * * *"
    RAG_API_URL: http://people-priority-rag-api:8090
    WATER_CANNON_ALERTS_ENABLED: "false"
    WATER_CANNON_AQI_THRESHOLD: "301"
  openAiCompatible:
    existingSecret: ""
    secretKey: api-key
  extraSecretEnv: []
  googleMaps:
    existingSecret: ""
    secretKey: api-key
    browserExistingSecret: ""
    browserSecretKey: api-key
    mapId: ""
    mapIdExistingSecret: ""
    mapIdSecretKey: map-id
  boundaries:
    configMapName: ""
    mountPath: /app/services/api/boundaries

batch:
  enabled: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

simulation:
  enabled: false
  schedule: "* * * * *"
  apiUrl: http://people-priority-api:8080
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  payloads:
    - channel: text
      language: Hindi
      state: Delhi
      district: Central Delhi
      ward: River Market
      urgency: 5
      rating: 5
      text: Ambulance route blocked by deep potholes near the river market.
    - channel: whatsapp
      language: English
      state: Delhi
      district: East Delhi
      ward: East Colony
      urgency: 4
      rating: 4
      text: Elderly residents need an evening clinic and medicine counter nearby.
    - channel: photo
      language: Hindi
      state: Delhi
      district: Central Delhi
      ward: Kalindi Nagar
      urgency: 4
      rating: 5
      text: School toilet repair and classroom flooding need urgent inspection.
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

rag:
  api:
    replicaCount: 2
    image:
      repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/rag-api
      tag: latest
    serviceAnnotations: {}
    service:
      port: 8090
    database:
      existingSecret: ""
      secretKey: RAG_DATABASE_URL
      createSecret: false
    env:
      RAG_DATABASE_URL: ""
      RAG_TENANT_ID: loksetu
      RAG_NAMESPACE: india
      RAG_EMBEDDING_PROVIDER: gemini
      RAG_EMBEDDING_MODEL: gemini-embedding-001
      RAG_EMBEDDING_DIMENSIONS: "768"
      RAG_TOP_K: "8"
      RAG_SIMILARITY_THRESHOLD: "0.24"
      RAG_MINIMUM_CONFIDENCE: "0.28"
      RAG_REQUIRE_CITATIONS: "true"
      RAG_LLM_PROVIDER: gemini
      RAG_CHUNK_SIZE: "900"
      RAG_CHUNK_OVERLAP: "140"
      RAG_SEMANTIC_CHUNKING: "true"
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  embeddingWorker:
    replicaCount: 1
    intervalMs: "60000"
    batchSize: "500"
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  ingestionWorker:
    replicaCount: 1
    ingestPaths: services/rag-api/fixtures/bihar/census-bihar-2011.md,services/rag-api/fixtures/loksetu/delhi-constituency-intelligence.md,services/rag-api/fixtures/loksetu/citizen-feedback-digest.md,services/rag-api/fixtures/loksetu/rag-architecture.md
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 1Gi

ingress:
  enabled: true
  className: gce
  host: people-priority.example.gov
  citizenHost: citizen.people-priority.example.gov
  annotations:
    kubernetes.io/ingress.global-static-ip-name: people-priority-ingress-ip
    networking.gke.io/managed-certificates: people-priority-cert
  managedCertificate:
    enabled: true
    name: people-priority-cert
    domains:
      - people-priority.example.gov
      - citizen.people-priority.example.gov

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

postgres:
  enabled: false
  image: pgvector/pgvector:pg16
  database: loksetu
  username: loksetu
  password: loksetu
  storage: 10Gi
