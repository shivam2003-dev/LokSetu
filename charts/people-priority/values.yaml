global:
  imagePullPolicy: IfNotPresent

web:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/web
    tag: latest
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

api:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/PROJECT_ID/people-priority/api
    tag: latest
  service:
    port: 8080
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 600m
      memory: 512Mi
  env:
    NODE_ENV: production

ingress:
  enabled: false
  className: gce
  host: people-priority.example.gov

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
