global:
  imagePullPolicy: IfNotPresent

api:
  image:
    repository: people-priority-api
    tag: local-20260629-mapsfix
  env:
    NODE_ENV: production
    DATABASE_URL: postgres://loksetu:loksetu@people-priority-postgres:5432/loksetu
    VERTEX_AI_LOCATION: us-central1
    VERTEX_AI_MODEL: gemini-1.5-flash
    VERTEX_AI_DISABLED: "true"
    OPENAI_COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
    OPENAI_COMPATIBLE_MODEL: google/gemini-2.0-flash-001
    BATCH_SCHEDULE: "*/5 * * * *"
  openAiCompatible:
    existingSecret: people-priority-openai-compatible
    secretKey: api-key
  googleMaps:
    existingSecret: people-priority-google-maps
    secretKey: api-key

batch:
  enabled: true
  schedule: "*/5 * * * *"

web:
  image:
    repository: people-priority-web
    tag: local-20260629-mapsfix

citizen:
  image:
    repository: people-priority-citizen
    tag: local-20260629-mapsfix

postgres:
  enabled: true
  image: postgres:16-alpine
  database: loksetu
  username: loksetu
  password: loksetu
  storage: 2Gi

ingress:
  enabled: false
