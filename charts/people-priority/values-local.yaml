global:
  imagePullPolicy: IfNotPresent

components:
  serviceMonitor: false

api:
  image:
    repository: people-priority-api
    tag: local-20260629-rag-pipeline-traffic
  env:
    NODE_ENV: production
    DATABASE_URL: postgres://loksetu:loksetu@people-priority-postgres:5432/loksetu
    VERTEX_AI_LOCATION: us-central1
    VERTEX_AI_MODEL: gemini-1.5-flash
    VERTEX_AI_DISABLED: "true"
    OPENAI_COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
    OPENAI_COMPATIBLE_MODEL: google/gemini-2.0-flash-001
    BATCH_SCHEDULE: "*/5 * * * *"
    RAG_API_URL: http://people-priority-rag-api:8090
  auth:
    existingSecret: ""
    passwordKey: password
    secretKey: token-secret
  openAiCompatible:
    existingSecret: people-priority-openai-compatible
    secretKey: api-key
  googleMaps:
    existingSecret: people-priority-google-maps
    secretKey: api-key
    mapId: ""
    mapIdExistingSecret: ""
    mapIdSecretKey: map-id
  boundaries:
    configMapName: ""
    mountPath: /app/services/api/boundaries

batch:
  enabled: true
  schedule: "* * * * *"

simulation:
  enabled: true
  schedule: "* * * * *"

rag:
  api:
    image:
      repository: people-priority-rag-api
      tag: local-20260629-rag-relevance-gate
    database:
      createSecret: true
    env:
      RAG_DATABASE_URL: postgres://loksetu:loksetu@people-priority-postgres:5432/loksetu
      RAG_EMBEDDING_PROVIDER: hash
      RAG_EMBEDDING_MODEL: hashing-vectorizer-768
      RAG_LLM_PROVIDER: extractive
      RAG_SIMILARITY_THRESHOLD: "0.08"
      RAG_MINIMUM_CONFIDENCE: "0.08"
  ingestionWorker:
    ingestPaths: services/rag-api/fixtures/bihar/census-bihar-2011.md,services/rag-api/fixtures/loksetu/delhi-constituency-intelligence.md,services/rag-api/fixtures/loksetu/citizen-feedback-digest.md,services/rag-api/fixtures/loksetu/rag-architecture.md

web:
  image:
    repository: people-priority-web
    tag: local-20260629-rag-answer-format

citizen:
  image:
    repository: people-priority-citizen
    tag: local-20260629-production-rag

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: loksetu
  username: loksetu
  password: loksetu
  storage: 2Gi

ingress:
  enabled: false
