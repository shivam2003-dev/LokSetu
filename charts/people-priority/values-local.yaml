global:
  imagePullPolicy: IfNotPresent

api:
  image:
    repository: people-priority-api
    tag: local
  env:
    NODE_ENV: production
    DATABASE_URL: postgres://loksetu:loksetu@people-priority-postgres:5432/loksetu
    VERTEX_AI_LOCATION: us-central1
    VERTEX_AI_MODEL: gemini-1.5-flash
    VERTEX_AI_DISABLED: "true"
    BATCH_SCHEDULE: "*/5 * * * *"

batch:
  enabled: true
  schedule: "*/5 * * * *"

web:
  image:
    repository: people-priority-web
    tag: local

citizen:
  image:
    repository: people-priority-citizen
    tag: local

postgres:
  enabled: true
  image: postgres:16-alpine
  database: loksetu
  username: loksetu
  password: loksetu
  storage: 2Gi

ingress:
  enabled: false
