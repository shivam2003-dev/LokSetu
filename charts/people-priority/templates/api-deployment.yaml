{{- if .Values.components.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "people-priority.name" . }}-api
  labels:
    {{- include "people-priority.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "people-priority.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "people-priority.name" . }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "people-priority.name" . }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            {{- if .Values.api.env.DATABASE_URL }}
            - name: DATABASE_URL
              value: {{ .Values.api.env.DATABASE_URL | quote }}
            {{- end }}
            - name: VERTEX_AI_LOCATION
              value: {{ .Values.api.env.VERTEX_AI_LOCATION | quote }}
            - name: VERTEX_AI_MODEL
              value: {{ .Values.api.env.VERTEX_AI_MODEL | quote }}
            - name: VERTEX_AI_DISABLED
              value: {{ .Values.api.env.VERTEX_AI_DISABLED | quote }}
            - name: OPENAI_COMPATIBLE_BASE_URL
              value: {{ .Values.api.env.OPENAI_COMPATIBLE_BASE_URL | quote }}
            - name: OPENAI_COMPATIBLE_MODEL
              value: {{ .Values.api.env.OPENAI_COMPATIBLE_MODEL | quote }}
            {{- if .Values.api.openAiCompatible.existingSecret }}
            - name: OPENAI_COMPATIBLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.openAiCompatible.existingSecret | quote }}
                  key: {{ .Values.api.openAiCompatible.secretKey | quote }}
            {{- end }}
            - name: BATCH_SCHEDULE
              value: {{ .Values.api.env.BATCH_SCHEDULE | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
