{{- if .Values.components.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "people-priority.name" . }}-api
  labels:
    {{- include "people-priority.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "people-priority.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "people-priority.name" . }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "people-priority.name" . }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            {{- if .Values.api.env.VERTEX_AI_PROJECT_ID }}
            - name: VERTEX_AI_PROJECT_ID
              value: {{ .Values.api.env.VERTEX_AI_PROJECT_ID | quote }}
            {{- end }}
            {{- if .Values.api.env.GOOGLE_CLOUD_PROJECT }}
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.api.env.GOOGLE_CLOUD_PROJECT | quote }}
            {{- end }}
            {{- if .Values.api.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.database.existingSecret | quote }}
                  key: {{ .Values.api.database.secretKey | quote }}
            {{- else if .Values.api.env.DATABASE_URL }}
            - name: DATABASE_URL
              value: {{ .Values.api.env.DATABASE_URL | quote }}
            {{- end }}
            - name: VERTEX_AI_LOCATION
              value: {{ .Values.api.env.VERTEX_AI_LOCATION | quote }}
            - name: VERTEX_AI_MODEL
              value: {{ .Values.api.env.VERTEX_AI_MODEL | quote }}
            {{- with .Values.api.env.VERTEX_AI_FALLBACK_MODELS }}
            - name: VERTEX_AI_FALLBACK_MODELS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.AI_RETRY_ATTEMPTS }}
            - name: AI_RETRY_ATTEMPTS
              value: {{ . | quote }}
            {{- end }}
            - name: VERTEX_AI_DISABLED
              value: {{ .Values.api.env.VERTEX_AI_DISABLED | quote }}
            {{- with .Values.api.env.INDIC_LANGUAGE_PROVIDER_ORDER }}
            - name: INDIC_LANGUAGE_PROVIDER_ORDER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.INDIC_AI_RETRY_ATTEMPTS }}
            - name: INDIC_AI_RETRY_ATTEMPTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.SARVAM_API_BASE_URL }}
            - name: SARVAM_API_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.SARVAM_TRANSLATE_MODEL }}
            - name: SARVAM_TRANSLATE_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.SARVAM_SPEECH_MODEL }}
            - name: SARVAM_SPEECH_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.BHASHINI_PIPELINE_COMPUTE_URL }}
            - name: BHASHINI_PIPELINE_COMPUTE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.BHASHINI_AUTH_HEADER }}
            - name: BHASHINI_AUTH_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.BHASHINI_TRANSLATION_SERVICE_ID }}
            - name: BHASHINI_TRANSLATION_SERVICE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.BHASHINI_ASR_SERVICE_ID }}
            - name: BHASHINI_ASR_SERVICE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.OPENAI_COMPATIBLE_BASE_URL }}
            - name: OPENAI_COMPATIBLE_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.env.OPENAI_COMPATIBLE_MODEL }}
            - name: OPENAI_COMPATIBLE_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.openAiCompatible.existingSecret }}
            - name: OPENAI_COMPATIBLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.openAiCompatible.existingSecret | quote }}
                  key: {{ .Values.api.openAiCompatible.secretKey | quote }}
            {{- end }}
            {{- range .Values.api.extraSecretEnv }}
            - name: {{ .name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .secretKey | quote }}
            {{- end }}
            {{- if .Values.api.googleMaps.existingSecret }}
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.googleMaps.existingSecret | quote }}
                  key: {{ .Values.api.googleMaps.secretKey | quote }}
            {{- end }}
            {{- if .Values.api.googleMaps.browserExistingSecret }}
            - name: PUBLIC_GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.googleMaps.browserExistingSecret | quote }}
                  key: {{ .Values.api.googleMaps.browserSecretKey | quote }}
            {{- else if .Values.api.googleMaps.existingSecret }}
            - name: PUBLIC_GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.googleMaps.existingSecret | quote }}
                  key: {{ .Values.api.googleMaps.secretKey | quote }}
            {{- end }}
            {{- if .Values.api.googleMaps.mapIdExistingSecret }}
            - name: GOOGLE_MAPS_MAP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.googleMaps.mapIdExistingSecret | quote }}
                  key: {{ .Values.api.googleMaps.mapIdSecretKey | quote }}
            {{- else if .Values.api.googleMaps.mapId }}
            - name: GOOGLE_MAPS_MAP_ID
              value: {{ .Values.api.googleMaps.mapId | quote }}
            {{- end }}
            {{- if .Values.api.boundaries.configMapName }}
            - name: BOUNDARY_GEOJSON_DIR
              value: {{ .Values.api.boundaries.mountPath | quote }}
            {{- end }}
            - name: BATCH_SCHEDULE
              value: {{ .Values.api.env.BATCH_SCHEDULE | quote }}
            - name: RAG_API_URL
              value: {{ .Values.api.env.RAG_API_URL | quote }}
            - name: WATER_CANNON_ALERTS_ENABLED
              value: {{ .Values.api.env.WATER_CANNON_ALERTS_ENABLED | quote }}
            - name: WATER_CANNON_AQI_THRESHOLD
              value: {{ .Values.api.env.WATER_CANNON_AQI_THRESHOLD | quote }}
            - name: WATER_CANNON_ALERT_STATE
              value: {{ .Values.api.env.WATER_CANNON_ALERT_STATE | quote }}
            - name: WATER_CANNON_ALERT_DISTRICT
              value: {{ .Values.api.env.WATER_CANNON_ALERT_DISTRICT | quote }}
            - name: WATER_CANNON_ALERT_CONSTITUENCY_ID
              value: {{ .Values.api.env.WATER_CANNON_ALERT_CONSTITUENCY_ID | quote }}
            - name: WATER_CANNON_ALERT_CONSTITUENCY_NAME
              value: {{ .Values.api.env.WATER_CANNON_ALERT_CONSTITUENCY_NAME | quote }}
            - name: WATER_CANNON_ALERT_WARD
              value: {{ .Values.api.env.WATER_CANNON_ALERT_WARD | quote }}
            - name: WATER_CANNON_ALERT_DEPLOYMENT_SITE
              value: {{ .Values.api.env.WATER_CANNON_ALERT_DEPLOYMENT_SITE | quote }}
            - name: WATER_CANNON_ALERT_LATITUDE
              value: {{ .Values.api.env.WATER_CANNON_ALERT_LATITUDE | quote }}
            - name: WATER_CANNON_ALERT_LONGITUDE
              value: {{ .Values.api.env.WATER_CANNON_ALERT_LONGITUDE | quote }}
            - name: WATER_CANNON_ALERT_RESPONSE_WINDOW
              value: {{ .Values.api.env.WATER_CANNON_ALERT_RESPONSE_WINDOW | quote }}
            {{- with .Values.api.env.APP_DEMO_ACCESS_ENABLED }}
            - name: APP_DEMO_ACCESS_ENABLED
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.auth.existingSecret }}
            - name: APP_ACCESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.auth.existingSecret | quote }}
                  key: {{ .Values.api.auth.passwordKey | quote }}
            - name: APP_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.auth.existingSecret | quote }}
                  key: {{ .Values.api.auth.secretKey | quote }}
            - name: APP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.auth.existingSecret | quote }}
                  key: {{ .Values.api.auth.adminUsernameKey | quote }}
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.auth.existingSecret | quote }}
                  key: {{ .Values.api.auth.adminPasswordKey | quote }}
            {{- end }}
          {{- if .Values.api.boundaries.configMapName }}
          volumeMounts:
            - name: boundary-geojson
              mountPath: {{ .Values.api.boundaries.mountPath | quote }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if .Values.api.boundaries.configMapName }}
      volumes:
        - name: boundary-geojson
          configMap:
            name: {{ .Values.api.boundaries.configMapName | quote }}
      {{- end }}
{{- end }}
