{{- if .Values.components.ragApi }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "people-priority.name" . }}-rag-api
  labels:
    {{- include "people-priority.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag-api
  {{- with .Values.rag.api.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "people-priority.name" . }}
    app.kubernetes.io/component: rag-api
  ports:
    - name: http
      port: {{ .Values.rag.api.service.port }}
      targetPort: {{ .Values.rag.api.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "people-priority.name" . }}-rag-api
  labels:
    {{- include "people-priority.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag-api
spec:
  replicas: {{ .Values.rag.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "people-priority.name" . }}
      app.kubernetes.io/component: rag-api
  template:
    metadata:
      annotations:
        checksum/rag-config: {{ include (print $.Template.BasePath "/rag-config.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "people-priority.name" . }}
        app.kubernetes.io/component: rag-api
    spec:
      serviceAccountName: {{ include "people-priority.name" . }}
      containers:
        - name: rag-api
          image: "{{ .Values.rag.api.image.repository }}:{{ .Values.rag.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.rag.api.service.port }}
          env:
            - name: PORT
              value: {{ .Values.rag.api.service.port | quote }}
            {{- if or .Values.rag.api.database.existingSecret .Values.rag.api.database.createSecret }}
            - name: RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-rag-secret" (include "people-priority.name" .)) .Values.rag.api.database.existingSecret }}
                  key: {{ .Values.rag.api.database.secretKey }}
            {{- else if .Values.rag.api.env.RAG_DATABASE_URL }}
            - name: RAG_DATABASE_URL
              value: {{ .Values.rag.api.env.RAG_DATABASE_URL | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "people-priority.name" . }}-rag-config
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.rag.api.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.rag.api.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.rag.api.resources | nindent 12 }}
{{- end }}
