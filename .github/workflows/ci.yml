name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Build, Helm, Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}
      GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL || 'google/gemini-2.0-flash-001' }}
      VITE_CITIZEN_APP_URL: ${{ vars.VITE_CITIZEN_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Functional tests
        continue-on-error: true
        run: npm run test:functional

      - name: Secret-backed runtime config smoke
        if: ${{ env.PUBLIC_GOOGLE_MAPS_API_KEY != '' }}
        run: |
          PORT=18180 \
          VERTEX_AI_DISABLED=true \
          PUBLIC_GOOGLE_MAPS_API_KEY="${PUBLIC_GOOGLE_MAPS_API_KEY}" \
          GOOGLE_MAPS_MAP_ID="${GOOGLE_MAPS_MAP_ID}" \
          OPENAI_COMPATIBLE_BASE_URL="${OPENAI_COMPATIBLE_BASE_URL}" \
          OPENAI_COMPATIBLE_MODEL="${OPENAI_COMPATIBLE_MODEL}" \
          npm run dev -w services/api > /tmp/loksetu-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18180/healthz >/dev/null && break
            sleep 1
          done
          node --input-type=module -e '
            const config = await fetch("http://127.0.0.1:18180/api/client-config").then((r) => r.json());
            if (!config.maps.enabled || config.maps.source !== "runtime-api") {
              throw new Error(`runtime maps config missing: ${JSON.stringify({ enabled: config.maps.enabled, source: config.maps.source })}`);
            }
            console.log(JSON.stringify({ ok: true, maps: config.maps.source, dataMode: config.dataMode }));
          '

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build API image
        run: docker build -f services/api/Dockerfile -t loksetu-api:ci .

      - name: Build RAG image
        run: docker build -f services/rag-api/Dockerfile -t loksetu-rag-api:ci .

      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_CITIZEN_APP_URL="${VITE_CITIZEN_APP_URL}" \
            -f apps/web/Dockerfile \
            -t loksetu-web:ci .

      - name: Build citizen image
        run: docker build -f apps/citizen/Dockerfile -t loksetu-citizen:ci .

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint charts/people-priority

      - name: Helm render production
        run: helm template people-priority charts/people-priority > /tmp/people-priority.yaml

      - name: Helm render local
        run: helm template people-priority charts/people-priority -f charts/people-priority/values-local.yaml > /tmp/people-priority-local.yaml

      - name: Helm render split applications
        run: |
          helm template loksetu-platform charts/people-priority -f charts/people-priority/values.yaml -f charts/people-priority/values-platform.yaml > /tmp/loksetu-platform.yaml
          helm template loksetu-web charts/people-priority -f charts/people-priority/values.yaml -f charts/people-priority/values-web.yaml > /tmp/loksetu-web.yaml
          helm template apni-awaaz charts/people-priority -f charts/people-priority/values.yaml -f charts/people-priority/values-apni-awaaz.yaml > /tmp/apni-awaaz.yaml
          helm template loksetu-vector-index-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-vector-index.yaml > /tmp/loksetu-vector-index-local.yaml
          helm template loksetu-rag-api-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-rag-api.yaml > /tmp/loksetu-rag-api-local.yaml
          helm template loksetu-embedding-worker-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-embedding-worker.yaml > /tmp/loksetu-embedding-worker-local.yaml
          helm template loksetu-ingestion-worker-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-ingestion-worker.yaml > /tmp/loksetu-ingestion-worker-local.yaml
          helm template loksetu-data-pipeline-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-data-pipeline.yaml > /tmp/loksetu-data-pipeline-local.yaml
          helm template loksetu-simulation-traffic-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-simulation-traffic.yaml > /tmp/loksetu-simulation-traffic-local.yaml
          helm template loksetu-platform-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-platform.yaml > /tmp/loksetu-platform-local.yaml
          helm template loksetu-web-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-web.yaml > /tmp/loksetu-web-local.yaml
          helm template apni-awaaz-local charts/people-priority -f charts/people-priority/values-local.yaml -f charts/people-priority/values-local-apni-awaaz.yaml > /tmp/apni-awaaz-local.yaml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
