name: CD GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: loksetu-gcp-cd
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-72558650-faf6-4529-a05' }}
  REGION: ${{ vars.GCP_REGION || 'us-east4' }}
  ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE || 'argocd' }}
  ARGOCD_APPLICATION: ${{ vars.ARGOCD_APPLICATION || 'loksetu-gcp' }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'loksetu' }}
  VITE_CITIZEN_APP_URL: ${{ vars.GCP_CITIZEN_APP_URL || 'https://awaaz.shivam2003.com' }}
  PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}
  GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
  OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL || 'https://openrouter.ai/api/v1' }}
  OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL || 'google/gemini-2.0-flash-001' }}

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip cd]') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Functional tests
        run: npm run test:functional

      - name: Secret-backed runtime config smoke
        if: ${{ env.PUBLIC_GOOGLE_MAPS_API_KEY != '' }}
        run: |
          PORT=18180 \
          VERTEX_AI_DISABLED=true \
          PUBLIC_GOOGLE_MAPS_API_KEY="${PUBLIC_GOOGLE_MAPS_API_KEY}" \
          GOOGLE_MAPS_MAP_ID="${GOOGLE_MAPS_MAP_ID}" \
          OPENAI_COMPATIBLE_BASE_URL="${OPENAI_COMPATIBLE_BASE_URL}" \
          OPENAI_COMPATIBLE_MODEL="${OPENAI_COMPATIBLE_MODEL}" \
          npm run dev -w services/api > /tmp/loksetu-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18180/healthz >/dev/null && break
            sleep 1
          done
          node --input-type=module -e '
            const config = await fetch("http://127.0.0.1:18180/api/client-config").then((r) => r.json());
            if (!config.maps.enabled || config.maps.source !== "runtime-api") {
              throw new Error(`runtime maps config missing: ${JSON.stringify({ enabled: config.maps.enabled, source: config.maps.source })}`);
            }
            console.log(JSON.stringify({ ok: true, maps: config.maps.source, dataMode: config.dataMode }));
          '

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint GCP
        run: helm lint charts/people-priority -f charts/people-priority/values-gcp.yaml

      - name: Helm render GCP
        run: helm template loksetu-gcp charts/people-priority -f charts/people-priority/values.yaml -f charts/people-priority/values-gcp.yaml > /tmp/loksetu-gcp.yaml

  deploy:
    name: Build images and sync Argo CD
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: kubectl,gke-gcloud-auth-plugin

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Compute image tag
        run: |
          echo "IMAGE_TAG=gcp-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}-amd64" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/people-priority"
          docker build -f services/api/Dockerfile -t "${image_base}/api:${IMAGE_TAG}" .
          docker build -f services/rag-api/Dockerfile -t "${image_base}/rag-api:${IMAGE_TAG}" .
          docker build \
            --build-arg VITE_CITIZEN_APP_URL="${VITE_CITIZEN_APP_URL}" \
            -f apps/web/Dockerfile \
            -t "${image_base}/web:${IMAGE_TAG}" .
          docker build -f apps/citizen/Dockerfile -t "${image_base}/citizen:${IMAGE_TAG}" .

      - name: Push images
        run: |
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/people-priority"
          docker push "${image_base}/api:${IMAGE_TAG}"
          docker push "${image_base}/rag-api:${IMAGE_TAG}"
          docker push "${image_base}/web:${IMAGE_TAG}"
          docker push "${image_base}/citizen:${IMAGE_TAG}"

      - name: Update GCP Helm image tags
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "charts/people-priority/values-gcp.yaml";
          const imageTag = process.env.IMAGE_TAG;
          const text = fs.readFileSync(file, "utf8");
          const lines = text.split("\n");
          let topLevel = "";
          let inRagApi = false;

          const updated = lines.map((line) => {
            const topMatch = line.match(/^([a-zA-Z][a-zA-Z0-9]*):\s*$/);
            if (topMatch) {
              topLevel = topMatch[1];
              inRagApi = false;
            }

            if (topLevel === "rag" && /^  api:\s*$/.test(line)) {
              inRagApi = true;
            } else if (topLevel === "rag" && /^  [a-zA-Z][a-zA-Z0-9]*:\s*$/.test(line) && !/^  api:\s*$/.test(line)) {
              inRagApi = false;
            }

            if (["web", "citizen", "api"].includes(topLevel) && /^    tag:\s*/.test(line)) {
              return `    tag: ${imageTag}`;
            }
            if (topLevel === "rag" && inRagApi && /^      tag:\s*/.test(line)) {
              return `      tag: ${imageTag}`;
            }
            return line;
          });

          fs.writeFileSync(file, updated.join("\n"));
          NODE

      - name: Validate updated Helm chart
        run: |
          helm lint charts/people-priority -f charts/people-priority/values-gcp.yaml
          helm template loksetu-gcp charts/people-priority -f charts/people-priority/values.yaml -f charts/people-priority/values-gcp.yaml > /tmp/loksetu-gcp.yaml

      - name: Commit image tag update
        run: |
          if git diff --quiet charts/people-priority/values-gcp.yaml; then
            echo "No image tag changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/people-priority/values-gcp.yaml
          git commit -m "Deploy LokSetu GCP images ${IMAGE_TAG} [skip cd]"
          echo "DEPLOY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials "${GKE_CLUSTER_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}"

      - name: Sync Argo CD application
        run: |
          kubectl -n "${ARGOCD_NAMESPACE}" annotate application "${ARGOCD_APPLICATION}" \
            argocd.argoproj.io/refresh=hard \
            --overwrite
          kubectl -n "${ARGOCD_NAMESPACE}" patch application "${ARGOCD_APPLICATION}" --type merge -p '{}' || true
          revision="${DEPLOY_REVISION:-$(git rev-parse HEAD)}"
          for i in {1..60}; do
            sync_status="$(kubectl -n "${ARGOCD_NAMESPACE}" get application "${ARGOCD_APPLICATION}" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            health_status="$(kubectl -n "${ARGOCD_NAMESPACE}" get application "${ARGOCD_APPLICATION}" -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            synced_revision="$(kubectl -n "${ARGOCD_NAMESPACE}" get application "${ARGOCD_APPLICATION}" -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)"
            echo "Argo status: sync=${sync_status} health=${health_status} revision=${synced_revision}"
            if [ "${sync_status}" = "Synced" ] && [ "${health_status}" = "Healthy" ] && [ "${synced_revision}" = "${revision}" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Argo CD did not sync ${ARGOCD_APPLICATION} to ${revision} within the timeout." >&2
          exit 1

      - name: Verify workload rollout
        run: |
          kubectl -n people-priority rollout status deployment/people-priority-api --timeout=300s
          kubectl -n people-priority rollout status deployment/people-priority-rag-api --timeout=300s
          kubectl -n people-priority rollout status deployment/people-priority-web --timeout=300s
          kubectl -n people-priority rollout status deployment/people-priority-citizen --timeout=300s

      - name: Public smoke checks
        run: |
          curl -fsS https://loksetu.shivam2003.com/ >/dev/null
          curl -fsS https://awaaz.shivam2003.com/ >/dev/null
          curl -fsS https://loksetu.shivam2003.com/healthz >/dev/null
