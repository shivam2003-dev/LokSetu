apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: people-priority
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/people-priority.git
    targetRevision: main
    path: charts/people-priority
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: people-priority
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
