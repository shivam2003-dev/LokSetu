apiVersion: v1
kind: ConfigMap
metadata:
  name: loksetu-rag-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  loksetu-rag.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(loksetu_rag_request_latency_ms_count[5m])) by (route)",
              "legendFormat": "{{route}}"
            }
          ],
          "title": "RAG request rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(loksetu_rag_request_latency_ms_bucket[5m])) by (le, route))",
              "legendFormat": "p95 {{route}}"
            }
          ],
          "title": "RAG p95 latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "loksetu_rag_indexed_documents",
              "legendFormat": "documents"
            }
          ],
          "title": "Indexed documents",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "id": 4,
          "targets": [
            {
              "expr": "loksetu_rag_indexed_chunks",
              "legendFormat": "chunks"
            }
          ],
          "title": "Indexed chunks",
          "type": "stat"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "id": 5,
          "targets": [
            {
              "expr": "{namespace=\"people-priority\"} |= \"rag request\""
            }
          ],
          "title": "RAG logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["loksetu", "rag", "gitops"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "LokSetu RAG Observability",
      "uid": "loksetu-rag",
      "version": 1,
      "weekStart": ""
    }
